[project]
name = "ctmatch"
version = "0.1.0"
description = "Self-correcting clinical-trial eligibility matching agent with eval-driven development"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "qdrant-client>=1.12",
    "sentence-transformers>=3.3",
    "rank-bm25>=0.2.2",
    "requests>=2.32",
    "pydantic-settings>=2.6",
    "typer>=0.15",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pre-commit>=4.0",
]

[project.scripts]
ctmatch = "ctmatch.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctmatch"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
